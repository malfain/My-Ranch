<title>Peternakan Lembah Hijau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width farm app — sticky header, live pasture scene, rounded cards, fixed bottom tab bar. Single daylight look by choice. */
:root{
  --bg:#eef1e4;
  --card:#fffdf6;
  --ink:#27331f;
  --muted:#6c7760;
  --line:#e0e4d0;
  --green:#3d7a35;
  --leaf:#86bb55;
  --barn:#c4472f;
  --sun:#efb12c;
  --water:#3e8fc4;
  --warn:#d9822b;
  --bad:#c8432f;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px;min-height:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.avatar-me{width:44px;height:44px;border-radius:50%;background:#f5e3c2;display:grid;place-items:center;flex:none;border:2px solid var(--card);box-shadow:0 2px 6px rgba(60,70,30,.15)}
.who{flex:1;min-width:0}
.who small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.who h1{margin:0;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:4px 10px 4px 5px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(60,70,30,.12)}
.pill svg{width:20px;height:20px}
.lvl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--muted)}
.xp{width:58px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}

/* pasture */
.pasture{position:relative;height:230px;border-radius:24px;overflow:hidden;background:#9fcf73;box-shadow:0 6px 18px rgba(60,80,30,.18);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pasture.small{height:180px}
.pasture svg.scene{position:absolute;inset:0;width:100%;height:100%}
.pasture .sun{transition:opacity 1s}
.pasture .storm{opacity:0;transition:opacity 1s}
.pasture.wx-berawan .sun{opacity:.35}
.pasture.wx-hujan .sun{opacity:0}
.pasture.wx-hujan .storm,.pasture.wx-berawan .storm{opacity:1}
.night{position:absolute;inset:0;background:#1b2550;pointer-events:none;opacity:0;transition:opacity 2s;mix-blend-mode:multiply}
.rain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 9px,rgba(220,235,255,.55) 9px 10px,rgba(255,255,255,0) 10px 22px);background-size:60px 60px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-14px 60px}}
.layer{position:absolute;inset:0}
.sprite{position:absolute;left:0;top:0;transform-origin:50% 100%;cursor:pointer;will-change:left,top}
.sprite .bob{position:relative}
.sprite.walk .bob{animation:bob .36s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) rotate(1.5deg)}}
.sprite .flip{display:block;transition:transform .2s}
.sprite.left .flip{transform:scaleX(-1)}
.sprite svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{position:absolute;left:50%;bottom:calc(100% - 4px);transform:translateX(-50%);width:30px;height:30px;border-radius:50% 50% 50% 50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:float 1s ease-in-out infinite alternate}
.bubble::after{content:"";position:absolute;bottom:-4px;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--card);border-bottom:0}
.bubble svg{width:20px;height:20px}
.bubble.need{width:24px;height:24px;opacity:.92}
.bubble.need svg{width:15px;height:15px}
@keyframes float{to{transform:translate(-50%,-4px)}}
.pop{position:absolute;pointer-events:none;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;align-items:center;gap:3px;transform:translate(-50%,-100%);animation:pop 1.1s ease-out forwards;white-space:nowrap;z-index:999}
.pop svg{width:20px;height:20px}
@keyframes pop{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.scene-tag{position:absolute;left:12px;top:10px;background:rgba(255,253,246,.88);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}

/* cards */
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;text-wrap:balance}
h2 small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(60,70,30,.06)}
.stat{display:flex;gap:12px;align-items:center;min-width:0}
.stat > div{min-width:0}
.lbl{font-size:12px;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.sub{font-size:12px;color:var(--muted);font-weight:700}
.ring{--p:0;width:56px;height:56px;flex:none;border-radius:50%;background:conic-gradient(var(--ringc,var(--green)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:--p .5s}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.wxicon{width:48px;height:48px;flex:none}
.pen{display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.pen .face{width:56px;height:44px;border-radius:14px;background:#eef3df;display:grid;place-items:center;padding:4px}
.pen .face svg{width:100%;height:100%}
.pen .go{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.pen .n{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.pen .n small{font-size:14px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);width:max-content}
.tag.ok{background:#e1efd6;color:var(--green)}
.tag.warn{background:#fbead4;color:#a85f14}
.tag.bad{background:#f8dcd6;color:var(--bad)}
.tag.gold{background:#fbefc9;color:#8a6400}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{background:var(--card);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12.5px;text-align:center;box-shadow:0 1px 2px rgba(60,70,30,.06)}
.qbtn .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.qbtn .ic svg{width:24px;height:24px}
.qbtn small{color:var(--muted);font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums}
.qbtn:not(:disabled):active,.btn:not(:disabled):active,.pen:active{transform:scale(.97)}
.hint{color:var(--muted);font-size:12.5px;font-weight:700;text-align:center;margin:16px 0 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--card);font-weight:800;font-size:13.5px}
.chip .mini{width:30px;height:26px}
.chip .mini svg{width:100%;height:100%}
.chip.on{background:var(--green);color:#fff}
.chip em{font-style:normal;font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}

.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 2px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.row{display:grid;grid-template-columns:64px 1fr;gap:10px 12px;align-items:start}
.row .face{width:64px;height:56px;border-radius:16px;background:#eef3df;display:grid;place-items:center;padding:5px}
.row .face svg{width:100%;height:100%}
.row .name{font-family:var(--display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:6px}
.meter{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s;background:var(--c,var(--green))}
.bar i.low{background:var(--bad)}
.acts{grid-column:1/-1;display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:14px;background:var(--bg);font-weight:800;font-size:13px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--green);color:#fff}
.btn.gold{background:var(--sun);color:#3a2a00}
.btn.slim{flex:none;padding:8px 12px}

.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shop .card{display:flex;flex-direction:column;gap:6px}
.shop .face{height:70px;border-radius:16px;background:#eef3df;display:grid;place-items:center;padding:8px}
.shop .face svg{height:100%;width:auto;max-width:100%}
.price{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.price svg{width:16px;height:16px}
.line{display:flex;align-items:center;gap:12px}
.line .ico{width:44px;height:44px;border-radius:14px;background:#eef3df;display:grid;place-items:center;flex:none}
.line .ico svg{width:28px;height:28px}
.line .grow{flex:1;min-width:0}
.line .t{font-weight:800}
.line .s{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv .card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;text-align:center}
.inv svg{width:30px;height:30px}
.inv b{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.inv span{font-size:11.5px;color:var(--muted);font-weight:700}
.empty{text-align:center;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.reset{margin:26px auto 0;display:block;color:var(--bad);font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px}
.reset.arm{background:#f8dcd6}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(238,241,228,0))}
.tabbar nav{max-width:448px;margin:0 auto;background:var(--card);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 6px 20px rgba(50,60,30,.14)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:18px;font-size:11.5px;font-weight:800;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{background:#e4efd8;color:var(--green)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){.quick{grid-template-columns:1fr}.shop{grid-template-columns:1fr}.meters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.sprite.walk .bob,.bubble,.rain{animation:none}.pop{animation-duration:.01s}}
</style>

<div class="app">
  <header class="top">
    <div class="avatar-me" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="34" height="34"><path d="M7 18 Q20 2 33 18 Z" fill="#e0b15a"/><rect x="4" y="16.5" width="32" height="4" rx="2" fill="#c9963e"/><circle cx="20" cy="25" r="9" fill="#f1c9a0"/><circle cx="16.5" cy="24" r="1.3" fill="#3a2f2c"/><circle cx="23.5" cy="24" r="1.3" fill="#3a2f2c"/><path d="M16.5 28 q3.5 3 7 0" stroke="#3a2f2c" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="who">
      <small data-b="greet">Selamat pagi, Peternak</small>
      <h1>Lembah Hijau</h1>
    </div>
    <div class="pills">
      <span class="pill" aria-label="Koin"><span data-ico="coin"></span><span data-b="coins">0</span></span>
      <span class="lvl"><span data-b="level">Lv 1</span><span class="xp"><i data-b="xp"></i></span></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="tabbar">
  <nav aria-label="Menu utama">
    <button class="tab" data-act="tab" data-arg="home"><span data-ico="home"></span>Beranda</button>
    <button class="tab" data-act="tab" data-arg="ternak"><span data-ico="paw"></span>Ternak</button>
    <button class="tab" data-act="tab" data-arg="pasar"><span data-ico="shop"></span>Pasar</button>
    <button class="tab" data-act="tab" data-arg="gudang"><span data-ico="box"></span>Gudang</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

function newAnimal(kind, used){
  const names = KINDS[kind].names;
  let name = names.find(n=>!used.includes(n));
  if(!name) name = names[Math.floor(Math.random()*names.length)]+' '+(used.length+1);
  return {id:uid(), kind, name, food:85, water:85, joy:70, prog:Math.random()*.4, ready:false};
}
function freshState(){
  const s = {
    coins:250, xp:0, level:1, day:1, t:DAY*0.05,
    weather:'cerah', temp:30, wxT:70,

    market:{susu:1, telur:1, telurBebek:1, susuKambing:1},

    tools:{pompa:false, lumbung:false, keranjang:false},
    stats:{harvest:0, earned:0},
    animals:[], saved:Date.now()
  };
  ['sapi','ayam','ayam','bebek','kambing'].forEach(k=>s.animals.push(newAnimal(k, s.animals.map(a=>a.name))));
  return s;
}

/* ---------- rules ---------- */
const cap = k => KINDS[k].cap0 + state.caps[k]*KINDS[k].capStep;
const capCost = k => KINDS[k].capCost*(state.caps[k]+1);
const count = k => state.animals.filter(a=>a.kind===k).length;
const price = p => Math.round(PRODUCTS[p].base*state.market[p]);
const xpNeed = () => 40 + state.level*30;
const byId = id => state.animals.find(a=>a.id===id);
const hour = () => (6 + state.t/DAY*24) % 24;
function clockStr(){const h=hour(); const hh=Math.floor(h), mm=Math.floor((h-hh)*60/10)*10; return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function darkness(){const h=hour(); if(h>=19||h<4.5) return .42; if(h>=17) return (h-17)/2*.42; if(h<6) return (6-h)/1.5*.42; return 0;}
function greeting(){const h=hour(); const p = h>=4&&h<11?'pagi':h<15?'siang':h<18?'sore':'malam'; return `Selamat ${p}, Peternak`;}
function health(a){return Math.round((a.food+a.water+a.joy)/3);}
function farmHealth(){ if(!state.animals.length) return 0; return Math.round(state.animals.reduce((s,a)=>s+health(a),0)/state.animals.length); }
function mood(a){
  if(a.ready) return ['Siap panen','gold'];
  if(a.food<15) return ['Kelaparan','bad'];
  if(a.water<15) return ['Kehausan','bad'];
  if(a.food<35) return ['Lapar','warn'];
  if(a.water<35) return ['Haus','warn'];
  if(a.joy<30) return ['Bosan','warn'];
  return ['Sehat','ok'];
}

function rollWeather(){
  const r=Math.random(); const prev=state.weather;
  state.weather = r<.5?'cerah':r<.78?'berawan':'hujan';
  const w=WEATHER[state.weather]; state.temp=Math.round(rnd(w.t[0],w.t[1]));
  state.wxT = rnd(50,95);
  return prev!==state.weather;
}
function newDay(){
  state.day++;
  for(const p in state.market){ state.market[p]=Math.min(1.45,Math.max(.7,state.market[p]*rnd(.86,1.16))); }
  return true;
}

function sim(dt, live){
  state.t += dt;
  if(state.t>=DAY){ state.t-=DAY; newDay(); if(live) toast(`Hari ke-${state.day} dimulai. Harga pasar berubah.`); }
  state.wxT -= dt;
  if(state.wxT<=0 && rollWeather() && live && state.weather==='hujan') toast('Hujan turun. Ternak minum air hujan.');
  const rain = state.weather==='hujan', hot = state.weather==='cerah' && state.temp>=31;
  for(const a of state.animals){
    const k=KINDS[a.kind];
    a.food = Math.max(0, a.food - k.hunger*dt*.8);
    a.water = rain ? Math.min(100, a.water + 6*dt) : Math.max(0, a.water - k.thirst*dt*(hot?1.25:1)*.8);
    if(state.tools.pompa && a.water<70) a.water=100;
    if(state.tools.lumbung && a.food<35 && state.feed[k.feed]>0){ state.feed[k.feed]--; a.food=Math.min(100,a.food+FEED_GAIN); }
    const starving = a.food<15 || a.water<15;
    a.joy = Math.max(0, a.joy - (starving?.8:.22)*dt);
    if(!a.ready && !starving){
      a.prog += dt/k.time*(.7 + a.joy/200);
      if(a.prog>=1){ a.prog=1; a.ready=true; }
    }
    if(a.ready && state.tools.keranjang) collect(a, !live);
  }
}

function addXP(n){
  state.xp += n;
  while(state.xp >= xpNeed()){
    state.xp -= xpNeed(); state.level++;
    const bonus = state.level*40; state.coins += bonus;
    toast(`Naik ke Level ${state.level}. Bonus ${fmt(bonus)} koin.`);
  }
}
function collect(a, quiet){
  if(!a.ready) return 0;
  const k=KINDS[a.kind];
  const n = (a.joy>80 && Math.random()<.25) ? 2 : 1;
  state.products[k.product] += n;
  state.stats.harvest += n;
  a.ready=false; a.prog=0;
  addXP(k.xp*n);
  if(!quiet) popAt(a.id, `+${n}`, ICO[k.product]);
  return n;
}
function feedOne(a, quiet){
  const k=KINDS[a.kind];
  if(a.food>=92){ if(!quiet) toast(`${a.name} masih kenyang.`); return false; }
  if(state.feed[k.feed]<1){ if(!quiet) toast(`${FEEDS[k.feed].label} habis. Beli di Pasar.`); return false; }
  state.feed[k.feed]--; a.food=Math.min(100,a.food+FEED_GAIN); a.joy=Math.min(100,a.joy+3);
  if(!quiet) popAt(a.id,'', ICO[k.feed]);
  return true;
}
function waterOne(a, quiet){
  if(a.water>=95){ if(!quiet) toast(`${a.name} tidak haus.`); return false; }
  a.water=100; if(!quiet) popAt(a.id,'', ICO.air); return true;
}
function pet(a){
  a.joy=Math.min(100,a.joy+12); popAt(a.id,'', ICO.hati);
}

/* ---------- save ---------- */
function save(){ try{ state.saved=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    const base = freshState();
    for(const key of ['feed','products','market','caps','tools','stats']) s[key] = Object.assign({}, base[key], s[key]||{});
    if(!Array.isArray(s.animals)) return null;
    return s;
  }catch(e){ return null; }
}

/* ---------- pasture ---------- */
class Pasture{
  constructor(root, filter){
    this.root=root; this.filter=filter; this.sprites=new Map();
    root.innerHTML = scene() + '<div class="layer"></div><div class="night"></div><div class="rain" hidden></div>' +
      (filter==='all' ? '' : `<div class="scene-tag">Kandang ${KINDS[filter].label} · <span data-b="count:${filter}"></span></div>`);
    this.layer = $('.layer', root);
    this.sync();
  }
  list(){ return state.animals.filter(a=>this.filter==='all'||a.kind===this.filter).slice(0,24); }
  sync(){
    const want = this.list(), ids = new Set(want.map(a=>a.id));
    for(const [id,s] of this.sprites){ if(!ids.has(id)){ s.el.remove(); this.sprites.delete(id); } }
    for(const a of want){
      if(this.sprites.has(a.id)) continue;
      const k=KINDS[a.kind];
      const p = POS.get(a.id) || {x:rnd(10,90), y:rnd(70,94)};
      const el = document.createElement('div');
      el.className='sprite'; el.dataset.act='tap'; el.dataset.arg=a.id;
      el.setAttribute('role','button'); el.tabIndex=0; el.setAttribute('aria-label', `${k.label} ${a.name}`);
      el.style.width = k.size+'px';
      el.innerHTML = `<div class="bob"><span class="flip">${ART[a.kind]}</span></div><div class="bubble" hidden></div>`;
      this.layer.appendChild(el);
      const s = {el, a, x:p.x, y:p.y, tx:p.x, ty:p.y, wait:rnd(0,2.5), left:Math.random()<.5, bub:''};
      this.sprites.set(a.id, s); this.place(s);
    }
    this.bubbles();
  }
  place(s){
    const sc = .78 + (s.y-66)/30*.32;
    s.el.style.left = s.x+'%'; s.el.style.top = s.y+'%';
    s.el.style.transform = `translate(-50%,-100%) scale(${sc.toFixed(3)})`;
    s.el.style.zIndex = Math.round(s.y*10);
    s.el.classList.toggle('left', s.left);
    POS.set(s.a.id, {x:s.x, y:s.y});
  }
  frame(dt){
    const w = this.root.clientWidth || 400, h = this.root.clientHeight || 230;
    for(const s of this.sprites.values()){
      if(s.wait>0){ s.wait-=dt; if(s.el.classList.contains('walk')) s.el.classList.remove('walk'); continue; }
      const k = KINDS[s.a.kind];
      const tired = s.a.food<15 || s.a.water<15;
      const dxp=(s.tx-s.x)*w/100, dyp=(s.ty-s.y)*h/100, dist=Math.hypot(dxp,dyp);
      if(dist<1.5){
        s.wait = s.a.kind==='ayam' ? rnd(.4,2) : rnd(1.5,4.5);
        s.tx = Math.min(94,Math.max(6, s.x + rnd(-30,30)));
        s.ty = Math.min(95,Math.max(68, s.y + rnd(-12,12)));
        continue;
      }
      const v = k.speed*(tired?.4:1)*w/100*dt;
      const step=Math.min(1, v/dist);
      s.x += (s.tx-s.x)*step; s.y += (s.ty-s.y)*step;
      if(Math.abs(dxp)>1) s.left = dxp<0;
      if(!s.el.classList.contains('walk')) s.el.classList.add('walk');
      this.place(s);
    }
  }
  bubbles(){
    for(const s of this.sprites.values()){
      const a=s.a, k=KINDS[a.kind];
      const b = a.ready ? 'r' : a.food<30 ? 'f' : a.water<30 ? 'w' : '';
      if(b===s.bub) continue;
      s.bub=b; const el=$('.bubble', s.el);
      el.hidden = !b; el.classList.toggle('need', b!=='r');
      el.innerHTML = b==='r' ? ICO[k.product] : b==='f' ? ICO[k.feed] : b==='w' ? ICO.air : '';
    }
    const night=$('.night',this.root); if(night) night.style.opacity = darkness();
    const rain=$('.rain',this.root); if(rain) rain.hidden = state.weather!=='hujan';
    this.root.classList.remove('wx-cerah','wx-berawan','wx-hujan'); this.root.classList.add('wx-'+state.weather);
  }
  pos(id){ const s=this.sprites.get(id); return s ? {x:s.x, y:s.y, size:KINDS[s.a.kind].size} : null; }
}
function popAt(id, text, icon){
  if(!pasture) return;
  const p = pasture.pos(id); if(!p) return;
  const d=document.createElement('div'); d.className='pop';
  d.style.left=p.x+'%'; d.style.top=`calc(${p.y}% - ${Math.round(p.size*.55)}px)`;
  d.innerHTML = (icon||'') + (text?`<span>${text}</span>`:'');
  pasture.root.appendChild(d); setTimeout(()=>d.remove(), 1150);
}

/* ---------- bindings ---------- */
const B = {
  coins: el=>el.textContent=fmt(state.coins),
  level: el=>el.textContent='Lv '+state.level,
  xp: el=>el.style.width=Math.min(100,state.xp/xpNeed()*100)+'%',
  greet: el=>el.textContent=greeting(),
  hring: el=>{const h=farmHealth(); el.style.setProperty('--p',h); el.style.setProperty('--ringc', h>=60?'var(--green)':h>=35?'var(--warn)':'var(--bad)');},
  hpct: el=>el.textContent=farmHealth()+'%',
  htxt: el=>{const h=farmHealth(); el.textContent = !state.animals.length?'Kosong':h>=70?'Sehat':h>=45?'Cukup':'Perlu dirawat';},
  hsub: el=>{const n=state.animals.filter(a=>mood(a)[1]==='bad'||mood(a)[1]==='warn').length; el.textContent = n? `${n} ekor butuh perhatian` : 'Semua baik';},
  wxicon: el=>{ if(el.dataset.w!==state.weather){ el.dataset.w=state.weather; el.innerHTML=ICO[state.weather]; } },
  temp: el=>el.textContent=state.temp+'°C',
  wxtxt: el=>el.textContent=WEATHER[state.weather].label,
  clock: el=>el.textContent=`Hari ${state.day} · ${clockStr()}`,
  dayline: el=>el.textContent=`Harga hari ke-${state.day}`,
  day: el=>el.textContent=state.day,
  sh: el=>el.textContent=fmt(state.stats.harvest),
  se: el=>el.innerHTML=coinTxt(state.stats.earned),
  total: el=>el.textContent=state.animals.length+' ekor',
  num: (el,k)=>el.textContent=count(k),
  cap: (el,k)=>el.textContent=cap(k),
  count: (el,k)=>el.textContent=`${count(k)}/${cap(k)} ekor`,
  pentag: (el,k)=>{
    const list=state.animals.filter(a=>a.kind===k), r=list.filter(a=>a.ready).length, bad=list.filter(a=>['bad','warn'].includes(mood(a)[1])).length;
    const [t,c] = !list.length?['Kosong','']: r?[`${r} siap panen`,'gold'] : bad?[`${bad} butuh dirawat`,'warn'] : ['Sehat','ok'];
    const html=`<span class="tag ${c}">${t}</span>`; if(el.innerHTML!==html) el.innerHTML=html;
  },
  bar: (el,arg)=>{const [id,f]=arg.split('.'); const a=byId(id); if(!a) return; const v=f==='prog'?a.prog*100:a[f]; el.style.width=v+'%'; el.classList.toggle('low', f!=='prog' && v<25);},
  mood: (el,id)=>{const a=byId(id); if(!a) return; const [t,c]=mood(a); const html=`<span class="tag ${c}">${t}</span>`; if(el.innerHTML!==html) el.innerHTML=html;},
  hbtn: (el,id)=>{const a=byId(id); el.disabled=!a||!a.ready;},
  stock: (el,p)=>el.textContent=fmt(state.products[p]),
  feed: (el,f)=>el.textContent=fmt(state.feed[f]),
  price: (el,p)=>el.textContent=fmt(price(p))+' koin',
  trend: (el,p)=>{const m=state.market[p]; el.className=m>1.04?'up':m<.96?'down':''; el.textContent=m>1.04?'▲ naik':m<.96?'▼ turun':'• normal';},
  sell: (el,p)=>el.disabled=state.products[p]<1,
  buy: (el,k)=>el.disabled=state.coins<KINDS[k].price||count(k)>=cap(k),
  buyfeed: (el,f)=>el.disabled=state.coins<FEEDS[f].price*FEEDS[f].pack,
  uppen: (el,k)=>{el.innerHTML=`+${KINDS[k].capStep} · ${ICO.coin}${fmt(capCost(k))}`; el.disabled=state.coins<capCost(k);},

  toolbtn: (el,t)=>el.disabled=state.coins<TOOLS[t].price,

function refresh(){
  for(const el of $$('[data-b]')){
    const s=el.dataset.b, i=s.indexOf(':');
    const key = i<0?s:s.slice(0,i), arg = i<0?'':s.slice(i+1);
    if(B[key]) B[key](el,arg);
  }
  if(pasture) pasture.bubbles();
}
function render(){
  $('#view').innerHTML = V[ui.tab]();
  $$('.tab').forEach(t=>{const on=t.dataset.arg===ui.tab; t.classList.toggle('on',on); t.setAttribute('aria-current', on?'page':'false');});
  const root=$('#pasture');
  pasture = root ? new Pasture(root, root.dataset.filter) : null;
  refresh();
}
function fillIcons(){ $$('[data-ico]').forEach(el=>el.innerHTML=ICO[el.dataset.ico]); }

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- actions ---------- */
let resetArmed=false, resetT;
const ACT = {
  tab: a=>{ ui.tab=a; render(); window.scrollTo({top:0}); },
  kind: k=>{ ui.kind=k; ui.tab='ternak'; render(); },
  tap: id=>{ const a=byId(id); if(!a) return; if(a.ready) collect(a); else pet(a); },
  pet: id=>{ const a=byId(id); if(a) pet(a); },
  feed: id=>{ const a=byId(id); if(a) feedOne(a); },
  water: id=>{ const a=byId(id); if(a) waterOne(a); },
  harvest: id=>{ const a=byId(id); if(a) collect(a); },
  feedAll: ()=>{
    let n=0, short=new Set();
    for(const a of state.animals){ if(a.food<92){ if(state.feed[KINDS[a.kind].feed]<1) short.add(FEEDS[KINDS[a.kind].feed].label); else if(feedOne(a,true)){ n++; popAt(a.id,'',ICO[KINDS[a.kind].feed]); } } }
    toast(n ? `${n} ekor sudah diberi pakan.` + (short.size?` ${[...short].join(' & ')} habis.`:'') : short.size ? `${[...short].join(' & ')} habis. Beli di Pasar.` : 'Semua ternak sudah kenyang.');
  },
  waterAll: ()=>{ let n=0; for(const a of state.animals) if(waterOne(a,true)){ n++; popAt(a.id,'',ICO.air); } toast(n?`${n} ekor sudah minum.`:'Semua ternak tidak haus.'); },
  harvestAll: ()=>{
    const got={}; for(const a of state.animals){ if(a.ready){ const p=KINDS[a.kind].product; got[p]=(got[p]||0)+collect(a); } }
    const parts=Object.entries(got).map(([p,n])=>`${n} ${PRODUCTS[p].label.toLowerCase()}`);
    toast(parts.length?`Dipanen: ${parts.join(', ')}.`:'Belum ada yang siap dipanen.');
  },
  buy: k=>{
    const K=KINDS[k];
    if(count(k)>=cap(k)) return toast(`Kandang ${K.label.toLowerCase()} penuh. Perluas di Gudang.`);
    if(state.coins<K.price) return toast('Koin belum cukup.');
    state.coins-=K.price;
    const a=newAnimal(k, state.animals.map(x=>x.name)); state.animals.push(a);
    toast(`${K.label} baru bernama ${a.name} masuk kandang.`); render(); save();
  },
  buyFeed: f=>{ const F=FEEDS[f], c=F.price*F.pack; if(state.coins<c) return toast('Koin belum cukup.'); state.coins-=c; state.feed[f]+=F.pack; toast(`+${F.pack} ${F.unit} ${F.label.toLowerCase()}.`); },
  sell: arg=>{
    const [p,q]=arg.split(':'); const n = q==='all'?state.products[p]:Math.min(1,state.products[p]);
    if(n<1) return; const got=n*price(p);
    state.products[p]-=n; state.coins+=got; state.stats.earned+=got;
    toast(`Terjual ${n} ${PRODUCTS[p].unit} ${PRODUCTS[p].label.toLowerCase()}: +${fmt(got)} koin.`);
  },
  upPen: k=>{ const c=capCost(k); if(state.coins<c) return toast('Koin belum cukup.'); state.coins-=c; state.caps[k]++; toast(`Kandang ${KINDS[k].label.toLowerCase()} kini muat ${cap(k)} ekor.`); save(); },
  tool: t=>{ const T=TOOLS[t]; if(state.tools[t]) return; if(state.coins<T.price) return toast('Koin belum cukup.'); state.coins-=T.price; state.tools[t]=true; toast(`${T.label} terpasang.`); save(); },
  reset: ()=>{
    const btn=$('#resetBtn');
    if(!resetArmed){ resetArmed=true; btn.classList.add('arm'); btn.textContent='Ketuk sekali lagi untuk menghapus semua kemajuan'; clearTimeout(resetT); resetT=setTimeout(()=>{resetArmed=false; if(btn.isConnected){btn.classList.remove('arm'); btn.textContent='Mulai ulang peternakan';}},3500); return; }
    resetArmed=false; state=freshState(); POS.clear(); ui={tab:'home',kind:'sapi'}; save(); render(); toast('Peternakan dimulai dari awal.');
  }
};
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const f=ACT[el.dataset.act]; if(!f) return;
  f(el.dataset.arg); refresh();
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList?.contains('sprite')){ e.preventDefault(); e.target.click(); }
});

/* ---------- loop ---------- */
let last=performance.now();
function raf(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(pasture) pasture.frame(dt); requestAnimationFrame(raf); }
function start(data){
  state = (data && data.state) || load() || freshState();
  if(data && data.ui) ui = data.ui;
  const away = Math.min(900, Math.max(0, (Date.now()-(state.saved||Date.now()))/1000));
  for(let i=0;i<Math.floor(away);i++) sim(1,false);
  fillIcons(); render();
  if(away>60) toast(`Selamat datang kembali. ${Math.round(away/60)} menit berlalu di peternakan.`);
  let n=0;
  setInterval(()=>{ sim(1,true); refresh(); if(++n%5===0) save(); }, 1000);
  addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
  requestAnimationFrame(raf);
  window.claude?.hot?.snapshot?.(()=>({state, ui}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
